              if [ "$SYNC_ACTION" = "promoted" ]; then
                set +e
                curl --fail --silent --show-error --request POST --header "Authorization: Bearer ${REVALIDATE_SECRET}" "${SITE_URL}/api/revalidate?scope=courses" | tee /tmp/sync-results/revalidation-response.json
                REVALIDATION_EXIT=${PIPESTATUS[0]}
                set -e
              else
                echo "Skipping revalidation: sync action was '${SYNC_ACTION}'."
              fi
            else
              echo "Skipping revalidation: synchronization or validation failed."
            fi
            printf '%s\n' "$REVALIDATION_EXIT" > /tmp/sync-results/revalidation-exit-code
      - store_artifacts: { path: /tmp/sync-results, destination: course-sync-results }
      - run:
          name: Report course synchronization result
