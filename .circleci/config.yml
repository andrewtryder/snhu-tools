version: 2.1

parameters:
  run_program_sync:
    type: boolean
    default: false
  run_course_sync:
    type: boolean
    default: false
  run_transfer_sync:
    type: boolean
    default: false

executors:
  node-executor:
    docker:
      - image: cimg/node:24.13
    resource_class: small

commands:
  install_dependencies:
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          paths:
            - ~/.npm
          key: v1-deps-{{ checksum "package-lock.json" }}

jobs:
  sync-program-catalog:
    executor: node-executor
    steps:
      - install_dependencies
      - run: { name: Run database migrations, command: npm run db:migrate }
      - run:
          name: Execute program catalog synchronization
          command: |
            set -uo pipefail
            mkdir -p /tmp/sync-results
            set +e
            npm run program:sync 2>&1 | tee /tmp/sync-results/sync-output.log
            SYNC_EXIT=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$SYNC_EXIT" > /tmp/sync-results/sync-exit-code
            tail -n 1 /tmp/sync-results/sync-output.log > /tmp/sync-results/sync-output.json
            set +e
            node scripts/validate-sync-result.mjs /tmp/sync-results/sync-output.json
            VALIDATION_EXIT=$?
            set -e
            printf '%s\n' "$VALIDATION_EXIT" > /tmp/sync-results/validation-exit-code
            exit 0
      - run:
          name: Revalidate programs after promotion
          command: |
            set -euo pipefail
            SYNC_EXIT=$(cat /tmp/sync-results/sync-exit-code)
            VALIDATION_EXIT=$(cat /tmp/sync-results/validation-exit-code)
            REVALIDATION_EXIT=0
            if [ "$SYNC_EXIT" -eq 0 ] && [ "$VALIDATION_EXIT" -eq 0 ]; then
              SYNC_ACTION=$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("/tmp/sync-results/sync-output.json", "utf8")).action);')
              if [ "$SYNC_ACTION" = "promoted" ]; then
                set +e
                curl --fail --silent --show-error --request POST --header "Authorization: Bearer ${REVALIDATE_SECRET}" "${SITE_URL}/api/revalidate?scope=programs" | tee /tmp/sync-results/revalidation-response.json
                REVALIDATION_EXIT=${PIPESTATUS[0]}
                set -e
              else
                echo "Skipping revalidation: sync action was '${SYNC_ACTION}'."
              fi
            else
              echo "Skipping revalidation: synchronization or validation failed."
            fi
            printf '%s\n' "$REVALIDATION_EXIT" > /tmp/sync-results/revalidation-exit-code
      - store_artifacts: { path: /tmp/sync-results, destination: program-sync-results }
      - run:
          name: Report program synchronization result
          command: |
            set -euo pipefail
            SYNC_EXIT=$(cat /tmp/sync-results/sync-exit-code)
            VALIDATION_EXIT=$(cat /tmp/sync-results/validation-exit-code)
            SYNC_ACTION=$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("/tmp/sync-results/sync-output.json", "utf8")).action);')
            if [ "$SYNC_EXIT" -ne 0 ] || [ "$VALIDATION_EXIT" -ne 0 ] || [ "$SYNC_ACTION" = "error" ]; then exit 1; fi
            if [ "$SYNC_ACTION" = "promoted" ] && [ "$(cat /tmp/sync-results/revalidation-exit-code)" -ne 0 ]; then exit 1; fi

  sync-course-catalog:
    executor: node-executor
    steps:
      - install_dependencies
      - run: { name: Run database migrations, command: npm run db:migrate }
      - run:
          name: Execute course catalog synchronization
          command: |
            set -uo pipefail
            mkdir -p /tmp/sync-results
