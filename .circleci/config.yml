              if [ "$SYNC_ACTION" = "promoted" ]; then
                set +e
                curl --fail --silent --show-error --request POST --header "Authorization: Bearer ${REVALIDATE_SECRET}" "${SITE_URL}/api/revalidate?scope=transfers" | tee /tmp/sync-results/revalidation-response.json
