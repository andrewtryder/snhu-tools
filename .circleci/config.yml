            SYNC_ACTION=$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("/tmp/sync-results/sync-output.json", "utf8")).action);')
            if [ "$SYNC_EXIT" -ne 0 ] || [ "$VALIDATION_EXIT" -ne 0 ] || [ "$SYNC_ACTION" = "error" ]; then exit 1; fi
            if [ "$SYNC_ACTION" = "promoted" ] && [ "$(cat /tmp/sync-results/revalidation-exit-code)" -ne 0 ]; then exit 1; fi

  sync-transfer-data:
    executor: node-executor
    steps:
      - install_dependencies
      - run: { name: Run database migrations, command: npm run db:migrate }
      - run:
          name: Execute transfer synchronization
          command: |
            set -uo pipefail
            mkdir -p /tmp/sync-results
            set +e
            npm run transfer:sync 2>&1 | tee /tmp/sync-results/sync-output.log
